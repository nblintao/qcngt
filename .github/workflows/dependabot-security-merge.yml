# No PR checkout, PR artifacts, PR caches, or PR code in either job.
name: Merge Dependabot security updates

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions: {}

concurrency:
  group: dependabot-security-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: master
  CI_WORKFLOW: deploy.yml

jobs:
  inspect:
    if: >-
      github.repository == 'nblintao/qcngt' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.candidate.outputs.number }}
      sha: ${{ steps.candidate.outputs.sha }}
      base: ${{ steps.candidate.outputs.base }}
      security: ${{ steps.candidate.outputs.eligible == 'true' && steps.metadata.outputs.dependency-group == 'security-updates' && steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' && steps.metadata.outputs.target-branch == 'master' }}
    steps:
      - name: Verify the PR and its tested commit
        id: candidate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const branch = process.env.DEFAULT_BRANCH;
            const skip = message => core.info(`Not eligible: ${message}`);
            if (run.event !== 'pull_request' || run.conclusion !== 'success' ||
                run.actor?.login !== 'dependabot[bot]' || run.head_repository?.full_name !== fullName) {
              return skip('not a successful same-repository Dependabot PR run');
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({
              ...repo, workflow_id: process.env.CI_WORKFLOW
            });
            if (run.workflow_id !== workflow.id || run.path !== workflow.path) {
              return skip('unexpected CI workflow');
            }
            const prs = await github.paginate(github.rest.pulls.list, {
              ...repo, state: 'open', base: branch,
              head: `${repo.owner}:${run.head_branch}`, per_page: 100
            });
            const matches = prs.filter(pr => pr.head.sha === run.head_sha);
            if (matches.length !== 1) return skip('no unique open PR for the tested commit');
            const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: matches[0].number });
            if (pr.user.login !== 'dependabot[bot]' || pr.draft || pr.state !== 'open' ||
                pr.head.repo?.full_name !== fullName || pr.base.repo.full_name !== fullName ||
                pr.base.ref !== branch || pr.head.sha !== run.head_sha) {
              return skip('PR identity, branch or commit changed');
            }
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...repo, pull_number: pr.number, per_page: 100
            });
            if (!commits.length || commits.length !== pr.commits ||
                commits[commits.length - 1].sha !== pr.head.sha ||
                commits.some(c => c.author?.login !== 'dependabot[bot]' || !c.commit.verification?.verified)) {
              return skip('all commits must be verified Dependabot commits');
            }
            if (commits.some((c, i) => c.parents.length !== 1 || (i > 0 && c.parents[0].sha !== commits[i - 1].sha))) {
              return skip('Dependabot commits must form a linear chain from the tested base');
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...repo, pull_number: pr.number, per_page: 100
            });
            if (!files.length || files.length !== pr.changed_files || files.some(f =>
                !['package.json', 'package-lock.json'].includes(f.filename) || f.status !== 'modified')) {
              return skip('changes outside the existing npm manifest/lockfile');
            }
            // The successful CI must use the current trusted workflow and security group.
            // In particular, an old PR cannot skip the new validation or change its rules.
            for (const path of [workflow.path, '.github/dependabot.yml']) {
              const { data: trusted } = await github.rest.repos.getContent({ ...repo, path, ref: branch });
              const { data: tested } = await github.rest.repos.getContent({ ...repo, path, ref: pr.head.sha });
              if (!trusted.sha || trusted.sha !== tested.sha) return skip('stale CI or Dependabot configuration');
            }
            // fetch-metadata expects a pull_request payload. Supply a fresh API response,
            // never a PR artifact or a checked-out PR script.
            const fs = require('fs');
            const path = require('path');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'dependabot-pr.json'),
              JSON.stringify({ pull_request: pr, repository: context.payload.repository }));
            core.setOutput('number', pr.number);
            core.setOutput('sha', pr.head.sha);
            core.setOutput('base', commits[0].parents[0].sha);
            core.setOutput('eligible', 'true');
      # fetch-metadata only accepts PR events. Run its pinned, unmodified
      # distribution with the verified API payload; Runner resets GITHUB_*
      # variables before each step, so set the event path in the child process.
      - name: Fetch the official metadata action (not PR code)
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          repository: dependabot/fetch-metadata
          ref: 25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
          path: .dependabot-metadata
          persist-credentials: false
      - name: Use the official metadata action's Node.js runtime
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read verified Dependabot metadata
        if: steps.candidate.outputs.eligible == 'true'
        id: metadata
        env:
          METADATA_EVENT_PATH: ${{ runner.temp }}/dependabot-pr.json
          INPUT_GITHUB-TOKEN: ${{ github.token }}
          INPUT_SKIP-COMMIT-VERIFICATION: 'false'
          INPUT_SKIP-VERIFICATION: 'false'
        run: GITHUB_EVENT_PATH="$METADATA_EVENT_PATH" node .dependabot-metadata/dist/index.js
        # alert-lookup needs an extra PAT/App token. Instead, use the official
        # applies-to: security-updates group and its signed commit metadata.

  merge:
    needs: inspect
    timeout-minutes: 15
    if: needs.inspect.outputs.security == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write # Only to request Dependabot rebases; no approvals.
      statuses: read
    steps:
      - name: Recheck CI, squash merge, and deploy the default branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_NUMBER: ${{ needs.inspect.outputs.number }}
          TESTED_SHA: ${{ needs.inspect.outputs.sha }}
          TESTED_BASE: ${{ needs.inspect.outputs.base }}
          BUILD_JOB: 'build'
          REQUIRED_STEPS: '["Install dependencies", "Build site"]'
        with:
          retries: 3
          script: |
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const branch = process.env.DEFAULT_BRANCH;
            const sha = process.env.TESTED_SHA;
            const testedBase = process.env.TESTED_BASE;
            const pull_number = Number(process.env.PR_NUMBER);
            const eventRun = context.payload.workflow_run;
            const skip = message => core.info(`Not merging: ${message}`);
            async function ciIsCurrent() {
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...repo, run_id: eventRun.id });
              if (run.status !== 'completed' || run.conclusion !== 'success' ||
                  run.event !== 'pull_request' || run.head_sha !== sha ||
                  run.run_attempt !== eventRun.run_attempt || run.workflow_id !== eventRun.workflow_id) return false;
              const { data: recent } = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: run.workflow_id, event: 'pull_request', head_sha: sha, per_page: 100
              });
              return recent.workflow_runs[0]?.id === run.id;
            }
            if (!await ciIsCurrent()) return skip('the exact/latest CI run is no longer successful');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: eventRun.id, filter: 'latest', per_page: 100
            });
            const builds = jobs.filter(job => job.name === process.env.BUILD_JOB);
            const requiredSteps = JSON.parse(process.env.REQUIRED_STEPS);
            if (builds.length !== 1 || builds.some(job => job.status !== 'completed' ||
                job.conclusion !== 'success' || requiredSteps.some(name =>
                  !job.steps.some(step => step.name === name && step.status === 'completed' && step.conclusion === 'success')))) {
              return skip('install/build/test did not all complete successfully');
            }
            async function requestRebase(baseSha) {
              const marker = `<!-- dependabot-security-rebase:${sha}:${baseSha} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pull_number, per_page: 100
              });
              if (!comments.some(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker))) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: pull_number, body: `@dependabot rebase

            ${marker}`
                });
              }
              core.info('Default branch changed since the tested head was based on it; requested a Dependabot rebase and fresh CI.');
            }
            // The primary CI may finish before another check. Wait here so completion of
            // that other check does not require someone to manually rerun this workflow.
            for (let attempt = 0; attempt < 60; attempt++) {
              if (!await ciIsCurrent()) return skip('CI was superseded while waiting');
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number });
              if (pr.user.login !== 'dependabot[bot]' || pr.state !== 'open' || pr.draft ||
                  pr.head.repo?.full_name !== fullName || pr.base.repo.full_name !== fullName ||
                  pr.head.sha !== sha || pr.base.ref !== branch) return skip('PR identity or revision changed');
              const { data: base } = await github.rest.repos.getBranch({ ...repo, branch });
              // PR CI checks out the exact head, and inspect proved its verified commit
              // chain starts at testedBase. Never combine it with an untested newer base.
              if (base.commit.sha !== testedBase) return await requestRebase(base.commit.sha);
              let pending = false;
              for (const ref of new Set([sha, pr.merge_commit_sha].filter(Boolean))) {
                const checks = await github.paginate(github.rest.checks.listForRef, {
                  ...repo, ref, filter: 'latest', per_page: 100
                });
                if (checks.some(c => c.status === 'completed' && !['success', 'neutral', 'skipped'].includes(c.conclusion))) {
                  return skip('another check failed');
                }
                pending ||= checks.some(c => c.status !== 'completed');
                const { data: status } = await github.rest.repos.getCombinedStatusForRef({ ...repo, ref });
                if (status.total_count > 0 && ['failure', 'error'].includes(status.state)) return skip('another commit status failed');
                pending ||= status.total_count > 0 && status.state !== 'success';
              }
              if (!pending && pr.mergeable === true && pr.mergeable_state === 'clean') {
                // Recheck the default branch immediately before the head-guarded merge.
                const { data: latestBase } = await github.rest.repos.getBranch({ ...repo, branch });
                if (latestBase.commit.sha !== testedBase) return await requestRebase(latestBase.commit.sha);
                const { data: result } = await github.rest.pulls.merge({
                  ...repo, pull_number, sha, merge_method: 'squash'
                });
                if (!result.merged) throw new Error(`Merge refused: ${result.message}`);
                core.info(`Merged PR #${pull_number} as ${result.sha}`);
                // GITHUB_TOKEN merges do not trigger push workflows. Dispatch only the
                // default branch so deployment rebuilds merged code through the normal CI.
                await github.rest.actions.createWorkflowDispatch({
                  ...repo, workflow_id: process.env.CI_WORKFLOW, ref: branch
                });
                core.info(`Dispatched ${process.env.CI_WORKFLOW} on ${branch}`);
                return;
              }
              if (!pending && ['blocked', 'dirty', 'draft', 'unstable'].includes(pr.mergeable_state)) {
                return skip('GitHub merge requirements are not satisfied');
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for parallel checks; no merge was performed.');
