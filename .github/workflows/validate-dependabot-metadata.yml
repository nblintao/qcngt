# Temporary, read-only integration check; removed after its successful PR run.
name: Validate Dependabot metadata integration
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
  pull-requests: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: 36 });
            require('fs').writeFileSync(`${process.env.RUNNER_TEMP}/dependabot-pr.json`,
              JSON.stringify({ pull_request: pr, repository: context.payload.repository }));
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        id: metadata
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/dependabot-pr.json
          GITHUB_EVENT_NAME: workflow_run
      - name: Verify official action outputs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
        with:
          script: |
            const assert = require('assert');
            assert.strictEqual(process.env.DEPENDENCY_GROUP, 'npm_and_yarn');
            assert.strictEqual(process.env.PACKAGE_ECOSYSTEM, 'npm_and_yarn');
            core.info('Official metadata action verified a signed historical Dependabot PR with the workflow_run payload adapter.');
